<style>
@font-face { font-family: "Virgil"; src: url(data:font/woff2;base64,__VIRGIL__) format("woff2"); font-display: block; }
:root {
  --paper: #ffffff; --ink: #1e1e1e; --muted: #6b6b6b; --dot: #dcdcdc;
  --select: #6965db; --chip: #f4f4f6;
  --hand: "Virgil", "Segoe Print", "Comic Sans MS", cursive;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--ui); display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; padding: 14px 24px 10px; border-bottom: 1.5px dashed #cfcfd6; }
h1 { font: 400 1.7rem/1.1 var(--hand); margin: 0; }
h1 small { display: block; font: .8rem var(--ui); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
button { font: 1rem var(--hand); color: var(--ink); background: var(--chip); border: 1.5px solid var(--ink); border-radius: 10px 12px 9px 13px; padding: 6px 14px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
button:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
button:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--select); outline-offset: 2px; }
button[aria-selected="true"] { background: #e5dbff; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 24px 0; font: .95rem var(--hand); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 12px; border: 1.5px solid; border-radius: 3px; display: inline-block; }
main { flex: 1; min-height: 0; display: flex; padding: 8px 16px; background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 22px 22px; }
svg#canvas { width: 100%; height: 100%; min-height: 360px; display: block; }
svg text { font-family: var(--hand); fill: var(--ink); }
.n, .e { transition: opacity .35s ease; }
.ring { opacity: 0; transition: opacity .3s; }
.on .ring { opacity: 1; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } }
.enter { animation: pop .45s ease backwards; transform-box: fill-box; }
@media (prefers-reduced-motion: reduce) { .enter { animation: none; } .n, .e, .ring { transition: none; } }
footer { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 10px 24px 16px; border-top: 1.5px dashed #cfcfd6; }
#caption { flex: 1 1 380px; font: 1.15rem/1.35 var(--hand); min-height: 2.7em; display: flex; align-items: center; }
#count { font: .85rem var(--ui); color: var(--muted); letter-spacing: .06em; min-width: 70px; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
kbd { font: .75rem var(--ui); border: 1px solid #bbb; border-radius: 4px; padding: 1px 5px; color: var(--muted); }
.hint { font: .8rem var(--ui); color: var(--muted); }
</style>

      { ids: ["agent", "tSof", "tKcc", "tRisk", "tCrop", "tWhat", "tAsk", "tFin"], text: "The agent works through 7 tools. They read the evidence themselves, so the model cannot pass a number in." },
      { ids: ["agent", "tRisk", "tCrop", "tWhat"], text: "Risk rules catch things like a name that does not match the record or a survey number already financed. What-ifs show the limit with one change." },
      { ids: ["tFin", "harness", "checks"], text: "The draft report goes to the harness: 8 deterministic checks." },
      { ids: ["harness", "repair", "agent", "down"], text: "A failed check gets one repair turn. If it still fails, the report becomes review with a template summary." },
      { ids: ["harness", "trans", "report"], text: "A passing report is translated into the officer's language, but only kept if the numbers match the English." },
      { ids: ["report", "officer", "agent", "audit"], text: "The officer answers any questions and can re-run. Every run lands in the audit chain." },
    ],
  },

  trust: {
    tab: "Trust guardrails", vb: [1740, 1000],
    intro: "Who is allowed to do what: AI handles words, the engine handles numbers, the officer handles the decision.",
    nodes: [
      N("ai", 40, 120, 300, 120, "AI models", "read · transcribe · translate\ndraft · speak", "violet"),
      N("eng", 40, 400, 300, 120, "Rules engine", "every rupee,\nevery paragraph", "green"),
      N("off", 420, 560, 270, 120, "Officer", "the only one who decides", "red"),
      N("fig", 420, 260, 270, 120, "Figure check", "note + agent harness:\nunknown rupee is never shown", "yellow"),
      N("log", 420, 800, 270, 110, "Audit chain", "append-only, SHA-256", "green"),
    ],
    edges: [
      E("ai", "r", "fig", "l", { line: true, label: "draft" }),
      E("eng", "r", "fig", "l", { line: true, label: "result" }),
      E("fig", "b", "off", "t", { label: "checked note" }),
      E("eng", "r", "off", "l", { line: true, label: "limit" }),
      E("off", "b", "log", "t"),
    ],
    stickies: [
      { id: "gNum", x: 760, y: 30, w: 460, h: 300, color: "green", rot: -1, title: "Numbers", lines: ["AI never computes, rounds or overrides a limit", "Every figure shows the RBI paragraph that produced it", "Note and agent figures are verified against tool output", "19 of 19 hand-computed RBI cases pass on device"] },
      { id: "gPeople", x: 1250, y: 30, w: 460, h: 300, color: "red", rot: 1, title: "People", lines: ["No auto-sanction: the agent only recommends", "Agent cannot approve over a high risk", "Officer approves, edits or rejects", "Edit or reject needs a written reason", "A decided case is locked"] },
      { id: "gPriv", x: 760, y: 470, w: 460, h: 330, color: "blue", rot: 1, title: "Privacy", lines: ["Aadhaar masked to the last 4 digits", "Photos and audio go to AI for extraction, then are discarded", "API keys only on the server", "Cases stay on the officer's device"] },
      { id: "gHonest", x: 1250, y: 470, w: 460, h: 330, color: "yellow", rot: -1, title: "Honesty", lines: ["Tamper-evident log: Verify chain finds the first changed record", "Proxy Scale of Finance labelled proxy on every screen", "Open rule interpretations listed in the validation pack", "Every AI call and agent run logged with the models used"] },
    ],
    details: {
      ai: "Sarvam and Claude extract, transcribe, translate, draft and speak. Their prompts forbid computing money, and their output is schema-constrained JSON.",
      eng: "Deterministic and pure: same inputs, same limit, every time. Covered by unit tests and a 19-case validation set.",
      off: "A named officer profile is attached to every decision in the audit log.",
      fig: "Rupee amounts in the note draft (including lakh and Devanagari digits) are parsed and compared with every number in the engine result. The agent report goes through 8 harness checks, and a translation is kept only if its numbers match the English.",
      log: "Each record carries the previous record's hash, so editing any past record breaks every hash after it.",
    },
    steps: [
      { ids: ["ai", "eng", "off"], text: "Three roles: AI handles words, the engine handles numbers, the officer handles the decision." },
      { ids: ["ai", "eng", "fig"], text: "The drafted note and the agent report are checked against tool results. A figure the engine did not produce is never shown." },
      { ids: ["gNum"], text: "Numbers: deterministic, cited and tested." },
      { ids: ["fig", "off", "gPeople"], text: "People: no automatic sanction. The officer decides, with a reason for any change." },
      { ids: ["gPriv"], text: "Privacy by minimisation: Aadhaar last 4 only, no stored media, keys on the server, data on the device." },
      { ids: ["off", "log", "gHonest"], text: "Honesty: a tamper-evident log, proxy data labelled, open interpretations listed." },

};

const svg = document.getElementById("canvas");
const NS = "http://www.w3.org/2000/svg";
const rc = rough.svg(svg);
let focusId = null, cur = "system", idx = -1, timer = null, groups = {}, edgeGroups = [];

const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const seedOf = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % 100000 + 1;
const SIDE = { r: [1, 0], l: [-1, 0], t: [0, -1], b: [0, 1] };
const anchor = (n, s) => ({
  r: [n.x + n.w, n.y + n.h / 2], l: [n.x, n.y + n.h / 2], t: [n.x + n.w / 2, n.y], b: [n.x + n.w / 2, n.y + n.h],
})[s];

function text(parent, x, y, str, size, color, anchorX = "middle") {
  const lines = str.split("\n");
  const t = el("text", { x, y, "font-size": size, "text-anchor": anchorX, fill: color || "#1e1e1e" }, parent);
  lines.forEach((ln, i) => { const s = el("tspan", { x, dy: i ? size * 1.15 : 0 }, t); s.textContent = ln; });
  return t;
}

function drawNode(n, g, i) {
  const [fill, stroke] = C[n.color];
  const o = { fill, stroke, strokeWidth: 2, fillStyle: "hachure", hachureGap: 7, fillWeight: 1.3, roughness: 1.3, bowing: 1.2, seed: seedOf(n.id) };
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  // white backing keeps hachure readable over the dot grid
  el("rect", { x: n.x + 3, y: n.y + 3, width: n.w - 6, height: n.h - 6, rx: 10, fill: "#fff", opacity: n.shape === "rect" ? 1 : 0 }, g);
  if (n.shape === "ellipse") g.appendChild(rc.ellipse(cx, cy, n.w, n.h, o));
  else if (n.shape === "diamond") g.appendChild(rc.polygon([[cx, n.y], [n.x + n.w, cy], [cx, n.y + n.h], [n.x, cy]], o));
  else g.appendChild(rc.rectangle(n.x, n.y, n.w, n.h, o));
  const ls = n.label.split("\n").length, ss = n.sub ? n.sub.split("\n").length : 0;
  const LS = 21, SS = 15, total = ls * LS * 1.15 + ss * SS * 1.15 + (ss ? 4 : 0);
  let y = cy - total / 2 + LS * 0.85;
  const parts = [text(g, cx, y, n.label, LS)];
  if (n.sub) parts.push(text(g, cx, y + ls * LS * 1.15 + 2, n.sub, SS, "#555"));
  const room = n.w * (n.shape === "rect" ? 1 : 0.72) - 18;
  for (const t of parts) { const w = t.getBBox().width; if (w > room) t.setAttribute("font-size", parseFloat(t.getAttribute("font-size")) * room / w); }
  const ring = rc.rectangle(n.x - 8, n.y - 8, n.w + 16, n.h + 16, { stroke: "#6965db", strokeWidth: 2.5, roughness: 1.6, seed: seedOf(n.id) + 3 });
  ring.classList.add("ring"); g.appendChild(ring);
  g.classList.add("n", "enter"); g.style.animationDelay = i * 45 + "ms";
}

function drawEdge(e, nodes, g, i) {
  const a = nodes[e.from], b = nodes[e.to];
  const p0 = anchor(a, e.fs), p1 = anchor(b, e.ts), d0 = SIDE[e.fs], d1 = SIDE[e.ts];
  const straight = (p0[0] === p1[0] || p0[1] === p1[1]) && d0[0] === -d1[0] && d0[1] === -d1[1] && !e.via || e.line;
  const k = Math.min(55, Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) / 3);
  const pts = straight ? [p0, p1] : [p0, [p0[0] + d0[0] * k, p0[1] + d0[1] * k], ...(e.via || []), [p1[0] + d1[0] * k, p1[1] + d1[1] * k], p1];
  const o = { stroke: "#1e1e1e", strokeWidth: 1.8, roughness: 1.1, bowing: 1.5, seed: seedOf(e.from + e.to) };
  if (e.dashed) o.strokeLineDash = [9, 8];
  g.appendChild(straight ? rc.line(p0[0], p0[1], p1[0], p1[1], o) : rc.curve(pts, o));
  const q = pts[pts.length - 2], ang = Math.atan2(p1[1] - q[1], p1[0] - q[0]), L = 15, sp = 0.5;
  for (const s of [-sp, sp]) g.appendChild(rc.line(p1[0], p1[1], p1[0] - L * Math.cos(ang + s), p1[1] - L * Math.sin(ang + s), { ...o, strokeLineDash: undefined }));
  if (e.label) {
    const m = e.labelAt || (pts.length === 2 ? [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2] : pts[Math.floor(pts.length / 2)]);
    const t = text(g, m[0], m[1] + 5, e.label, 17, "#495057");
    t.setAttribute("paint-order", "stroke"); t.setAttribute("stroke", "#fff"); t.setAttribute("stroke-width", 7); t.setAttribute("stroke-linejoin", "round");
  }
  g.classList.add("e", "enter"); g.style.animationDelay = 250 + i * 30 + "ms";
}

function wrap(str, size, width) {
  const max = Math.max(8, Math.floor(width / (size * 0.44))), out = [];
  for (const para of str.split("\n")) {
    let line = "";
    for (const w of para.split(" ")) { if (line && (line + " " + w).length > max) { out.push(line); line = w; } else line = line ? line + " " + w : w; }
    out.push(line);
  }
  return out;
}
function fit(t, room) { const w = t.getBBox().width; if (w > room) t.setAttribute("font-size", parseFloat(t.getAttribute("font-size")) * room / w); }

function drawSticky(s, g, i) {
  s.h = Math.max(s.h || 0, 80 + s.lines.reduce((h, it) => h + wrap(it, 18.5, s.w - 46).length * 25 + 6, 0));
  const [fill, stroke] = C[s.color || "yellow"], inner = el("g", { transform: `rotate(${s.rot || 0} ${s.x + s.w / 2} ${s.y + s.h / 2})` }, g);
  inner.appendChild(rc.rectangle(s.x, s.y, s.w, s.h, { fill, fillStyle: "solid", stroke, strokeWidth: 1.6, roughness: 1.5, seed: seedOf(s.id) }));
  fit(text(inner, s.x + 18, s.y + 36, s.title, 24, "#1e1e1e", "start"), s.w - 36);
  let y = s.y + 72;
  for (const item of s.lines) {
    wrap(item, 18.5, s.w - 46).forEach((ln, j) => { fit(text(inner, s.x + (j ? 36 : 18), y, (j ? "" : "• ") + ln, 18.5, "#333", "start"), s.w - 40); y += 25; });
    y += 6;
  }
  const ring = rc.rectangle(s.x - 8, s.y - 8, s.w + 16, s.h + 16, { stroke: "#6965db", strokeWidth: 2.5, roughness: 1.6, seed: seedOf(s.id) + 3 });
  ring.classList.add("ring"); inner.appendChild(ring);
  g.classList.add("n", "enter"); g.style.animationDelay = 150 + i * 60 + "ms";
}

function drawTable(tb, g, i) {
  const rh = tb.rowH || 40, xs = [tb.x], fillHead = C[tb.color || "violet"][0];
  tb.colW.forEach(w => xs.push(xs[xs.length - 1] + w));
  const W = xs[xs.length - 1] - tb.x, H = rh * tb.rows.length, o = { stroke: "#1e1e1e", strokeWidth: 1.3, roughness: 0.9, seed: seedOf(tb.id) };
  if (tb.title) text(g, tb.x, tb.y - 14, tb.title, 21, "#1e1e1e", "start");
  g.appendChild(rc.rectangle(tb.x, tb.y, W, rh, { ...o, fill: fillHead, fillStyle: "solid", stroke: "none" }));
  g.appendChild(rc.rectangle(tb.x, tb.y, W, H, { ...o, strokeWidth: 1.8 }));
  for (let r = 1; r < tb.rows.length; r++) g.appendChild(rc.line(tb.x, tb.y + r * rh, tb.x + W, tb.y + r * rh, { ...o, strokeWidth: r === 1 ? 1.8 : 0.9, seed: o.seed + r }));
  for (let c = 1; c < xs.length - 1; c++) g.appendChild(rc.line(xs[c], tb.y, xs[c], tb.y + H, { ...o, strokeWidth: 0.9, seed: o.seed + 50 + c }));
  tb.rows.forEach((row, r) => row.forEach((v, c) => {
    const cx = (xs[c] + xs[c + 1]) / 2, cy = tb.y + r * rh + rh / 2, mk = { roughness: 0.8, strokeWidth: 2.6, seed: o.seed + r * 9 + c };
    if (r && v === "Y") g.appendChild(rc.linearPath([[cx - 9, cy], [cx - 2, cy + 8], [cx + 11, cy - 9]], { ...mk, stroke: "#2f9e44" }));
    else if (r && v === "N") { g.appendChild(rc.line(cx - 7, cy - 7, cx + 7, cy + 7, { ...mk, stroke: "#e03131", strokeWidth: 2 })); g.appendChild(rc.line(cx + 7, cy - 7, cx - 7, cy + 7, { ...mk, stroke: "#e03131", strokeWidth: 2, seed: mk.seed + 1 })); }
    else {
      const left = c === 0, tt = text(g, left ? xs[c] + 12 : cx, cy + 6, v, r ? 17 : 18, r ? "#333" : "#1e1e1e", left ? "start" : "middle");
      fit(tt, xs[c + 1] - xs[c] - 16);
    }
  }));
  const ring = rc.rectangle(tb.x - 10, tb.y - 10, W + 20, H + 20, { stroke: "#6965db", strokeWidth: 2.5, roughness: 1.6, seed: o.seed + 3 });
  ring.classList.add("ring"); g.appendChild(ring);
  g.classList.add("n", "enter"); g.style.animationDelay = 150 + i * 80 + "ms";
}

function render() {
  const D = DIAGRAMS[cur];
  svg.innerHTML = ""; groups = {}; edgeGroups = [];
  svg.setAttribute("viewBox", `0 0 ${D.vb[0]} ${D.vb[1]}`);
  const nodes = Object.fromEntries([...D.nodes, ...(D.stickies || [])].map(n => [n.id, n]));
  (D.frames || []).forEach(f => {
    svg.appendChild(rc.rectangle(f.x, f.y, f.w, f.h, { stroke: "#868e96", strokeWidth: 1.5, strokeLineDash: [6, 7], roughness: 1.2, seed: 11 }));
    text(svg, f.x + 12, f.y + 26, f.label, 18, "#868e96", "start");
  });
  const eg = el("g", {}, svg);
  D.edges.forEach((e, i) => { const g = el("g", {}, eg); drawEdge(e, nodes, g, i); edgeGroups.push({ g, e }); });
  D.nodes.forEach((n, i) => { const g = el("g", { "data-id": n.id }, svg); drawNode(n, g, i); groups[n.id] = g; });
  (D.stickies || []).forEach((s, i) => { const g = el("g", { "data-id": s.id }, svg); drawSticky(s, g, i); groups[s.id] = g; });
  (D.tables || []).forEach((tb, i) => { const g = el("g", { "data-id": tb.id }, svg); drawTable(tb, g, i); groups[tb.id] = g; });
  for (const id in groups) if (D.details?.[id]) { groups[id].style.cursor = "pointer"; groups[id].addEventListener("click", () => { stop(); focusId = id; idx = -1; apply(); }); }
  (D.notes || []).forEach(nt => { const t = text(svg, nt.x, nt.y, nt.text, 18, "#868e96", "start"); t.classList.add("n"); groups["note:" + nt.x] = t; });
  apply();
}

function apply() {
  const D = DIAGRAMS[cur], step = D.steps[idx];
  const on = focusId ? new Set([focusId]) : step ? new Set(step.ids) : null;
  for (const id in groups) {
    const g = groups[id], active = !on || on.has(id);
    g.style.opacity = active || id.startsWith("note:") && !on ? 1 : 0.14;
    g.classList.toggle("on", !!on && on.has(id));
  }
  edgeGroups.forEach(({ g, e }) => { g.style.opacity = !on || (on.has(e.from) && on.has(e.to)) ? 1 : 0.1; });
  document.getElementById("caption").textContent = focusId ? D.details[focusId] : step ? step.text : D.intro;
  document.getElementById("count").textContent = focusId ? "DETAIL" : step ? `STEP ${idx + 1} / ${D.steps.length}` : `${D.steps.length} STEPS`;
}

function go(i) { focusId = null; const n = DIAGRAMS[cur].steps.length; idx = Math.max(-1, Math.min(n - 1, i)); apply(); }
function stop() { clearInterval(timer); timer = null; document.getElementById("play").textContent = "Play"; }
function play() {
  if (timer) return stop();
  if (idx >= DIAGRAMS[cur].steps.length - 1) idx = -1;
  go(idx + 1);
  document.getElementById("play").textContent = "Pause";
  timer = setInterval(() => { if (idx >= DIAGRAMS[cur].steps.length - 1) stop(); else go(idx + 1); }, 4200);
}
function switchTo(key) {
  stop(); cur = key; idx = -1; focusId = null;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === key));
  render();
}

const tabs = document.getElementById("tabs");
for (const k in DIAGRAMS) {
  const b = document.createElement("button"); b.setAttribute("role", "tab"); b.dataset.k = k; b.textContent = `${Object.keys(DIAGRAMS).indexOf(k) + 1}. ${DIAGRAMS[k].tab}`;
  b.onclick = () => switchTo(k); tabs.appendChild(b);
}
document.getElementById("next").onclick = () => { stop(); go(idx + 1); };
document.getElementById("prev").onclick = () => { stop(); go(idx - 1); };
document.getElementById("all").onclick = () => { stop(); go(-1); };
document.getElementById("play").onclick = play;
const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {});
document.getElementById("fs").onclick = fs;
document.addEventListener("keydown", ev => {
  if (ev.key === "ArrowRight") { stop(); go(idx + 1); }
  else if (ev.key === "ArrowLeft") { stop(); go(idx - 1); }
  else if (ev.key === "Escape") { stop(); go(-1); }
  else if (ev.key === " ") { ev.preventDefault(); play(); }
  else if (ev.key === "f" || ev.key === "F") fs();
  else if (/^[1-9]$/.test(ev.key) && Object.keys(DIAGRAMS)[+ev.key - 1]) switchTo(Object.keys(DIAGRAMS)[+ev.key - 1]);
});
document.fonts.load('21px "Virgil"').finally(() => {
  const [k, s] = location.hash.slice(1).split(".");
  switchTo(DIAGRAMS[k] ? k : "system");
  if (s) go(+s - 1);
});
</script>
